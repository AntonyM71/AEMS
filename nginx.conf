events { }

http {
    map $http_upgrade $connection_upgrade { default upgrade;
     '' close;
     }

    upstream frontend {
        server frontend:3000;
    }

    upstream server {
        server server:8000;
    }

    server {
        listen 80;

        # graphics_server runs in a separate, optional compose stack and may not
        # be up (or even resolvable) when nginx starts. Resolve its hostname at
        # request time via Docker's embedded DNS instead of a static upstream
        # block, so nginx still starts and serves the rest of the app when the
        # graphics stack isn't running.
        resolver 127.0.0.11 valid=10s;
        set $graphics_server_upstream http://graphics_server:82;

        location /api/ {
            proxy_pass http://server/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Increase timeouts
            proxy_read_timeout 7d;
            proxy_send_timeout 7d;
            proxy_connect_timeout 7d;

            # WebSocket specific
            proxy_buffering off;
            proxy_cache off;
        }
        location /socket.io/ {
            proxy_pass http://server/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;

            proxy_read_timeout 3600;
            proxy_send_timeout 3600;

            proxy_buffering off;
        }

        location / {
            proxy_pass http://frontend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /componentInfo/ {
            proxy_pass $graphics_server_upstream/componentInfo/;
            proxy_set_header Host $host;
        }

        location /assets/ {
            proxy_pass $graphics_server_upstream/assets/;
            proxy_set_header Host $host;
        }
    }
}
