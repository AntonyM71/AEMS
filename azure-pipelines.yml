trigger:
  - main

pool:
  vmImage: "ubuntu-latest"

jobs:
  - job: Python
    displayName: "Python Build & Test"
    steps:
      - script: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv venv
          uv sync --dev --locked
        displayName: "Setup Python Environment"
        workingDirectory: $(Build.SourcesDirectory)/Server
      - script: |
          uv run ruff check .
        displayName: "Run Python Linting"
        workingDirectory: $(Build.SourcesDirectory)/Server
      - script: |
          uv run python -m pytest --junitxml=pytest-results.xml
        displayName: "Run Python Tests"
        workingDirectory: $(Build.SourcesDirectory)/Server

      - task: PublishTestResults@2
        inputs:
          testResultsFormat: "JUnit"
          testResultsFiles: "$(Build.SourcesDirectory)/Server/pytest-results.xml"
          failTaskOnFailedTests: true
        displayName: "Publish Python Test Results"
        condition: succeededOrFailed()

  - job: PerformanceTests
    displayName: "Performance Benchmarks"
    steps:
      - script: |
          docker run -d --name postgres-performance \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=postgres \
            -p 5432:5432 \
            postgres:17
          for i in $(seq 1 30); do
            docker exec postgres-performance pg_isready -U postgres && break || sleep 2
          done
        displayName: "Start PostgreSQL"

      - script: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv venv
          uv sync --locked
        displayName: "Setup Python Environment"
        workingDirectory: $(Build.SourcesDirectory)/Server

      - script: |
          CONNECTION_STRING=postgresql://postgres:postgres@localhost:5432/postgres \
            $(Build.SourcesDirectory)/Server/.venv/bin/alembic upgrade head
          CONNECTION_STRING=postgresql://postgres:postgres@localhost:5432/postgres \
            $(Build.SourcesDirectory)/Server/.venv/bin/python -m scripts.seed_scoresheets
        displayName: "Setup Database"
        workingDirectory: $(Build.SourcesDirectory)/Server

      - script: |
          CONNECTION_STRING=postgresql://postgres:postgres@localhost:5432/postgres \
            $(Build.SourcesDirectory)/Server/.venv/bin/python -m pytest performance/ \
            --benchmark-json=benchmark-results.json --no-cov -s
        displayName: "Run Performance Benchmarks"
        workingDirectory: $(Build.SourcesDirectory)/Server

      - task: PublishPipelineArtifact@1
        inputs:
          targetPath: "$(Build.SourcesDirectory)/Server/benchmark-results.json"
          artifact: "performance-benchmarks"
        displayName: "Publish Benchmark Results"
        condition: succeededOrFailed()

      - script: |
          docker stop postgres-performance && docker rm postgres-performance
        displayName: "Stop Services"
        condition: always()

  - job: Timer
    displayName: "Timer Build & Test"
    steps:
      - script: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv venv
          uv sync --locked
        displayName: "Setup Timer Python Environment"
        workingDirectory: $(Build.SourcesDirectory)/Timer
      - script: |
          uv run ruff check src/
        displayName: "Run Timer Linting"
        workingDirectory: $(Build.SourcesDirectory)/Timer
      - script: |
          uv run python -m pytest --junitxml=pytest-results.xml
        displayName: "Run Timer Tests"
        workingDirectory: $(Build.SourcesDirectory)/Timer

      - task: PublishTestResults@2
        inputs:
          testResultsFormat: "JUnit"
          testResultsFiles: "$(Build.SourcesDirectory)/Timer/pytest-results.xml"
          failTaskOnFailedTests: true
        displayName: "Publish Timer Test Results"
        condition: succeededOrFailed()

  - job: NodeJS
    displayName: "Node.js Build & Test"
    steps:
      - task: NodeTool@0
        inputs:
          versionSpec: "24.x"
        displayName: "Install Node.js 24"

      - script: |
          npm ci
        displayName: "Install Node.js Dependencies"
        workingDirectory: $(Build.SourcesDirectory)/Webapp

      - script: |
          npm run tsc
        displayName: "Run TypeScript Compiler"
        workingDirectory: $(Build.SourcesDirectory)/Webapp

      - script: |
          npm run lint
        displayName: "Run Node.js Lint"
        workingDirectory: $(Build.SourcesDirectory)/Webapp

      - script: |
          npm test -- --reporters="jest-junit" --outputFile="junit.xml"
        displayName: "Run Node.js Tests"
        workingDirectory: $(Build.SourcesDirectory)/Webapp

      - script: |
          npm run build
        displayName: "Build Node.js Project"
        workingDirectory: $(Build.SourcesDirectory)/Webapp

      - task: PublishTestResults@2
        inputs:
          testResultsFormat: "JUnit"
          testResultsFiles: "$(Build.SourcesDirectory)/Webapp/junit.xml"
          failTaskOnFailedTests: true
        displayName: "Publish Node.js Test Results"
        condition: succeededOrFailed()

  - job: E2ETests
    displayName: "E2E Playwright Tests"
    steps:
      - task: NodeTool@0
        inputs:
          versionSpec: "24.x"
        displayName: "Install Node.js 24"

      - script: |
          docker run -d --name postgres-e2e \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=postgres \
            -p 5432:5432 \
            postgres:17
          for i in $(seq 1 30); do
            docker exec postgres-e2e pg_isready -U postgres && break || sleep 2
          done
        displayName: "Start PostgreSQL"

      - script: |
          docker run -d --name redis-e2e \
            -p 6379:6379 \
            redis:7-alpine
          for i in $(seq 1 15); do
            docker exec redis-e2e redis-cli ping | grep -q PONG && break || sleep 1
          done
        displayName: "Start Redis"

      - script: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv venv
          uv sync --locked
        displayName: "Setup Python Environment"
        workingDirectory: $(Build.SourcesDirectory)/Server

      - script: |
          CONNECTION_STRING=postgresql://postgres:postgres@localhost:5432/postgres \
            $(Build.SourcesDirectory)/Server/.venv/bin/alembic upgrade head
          CONNECTION_STRING=postgresql://postgres:postgres@localhost:5432/postgres \
            $(Build.SourcesDirectory)/Server/.venv/bin/python -m scripts.seed_scoresheets
        displayName: "Setup Database"
        workingDirectory: $(Build.SourcesDirectory)/Server

      - script: |
          CONNECTION_STRING=postgresql://postgres:postgres@localhost:5432/postgres \
            REDIS_URL=redis://localhost:6379/0 \
            $(Build.SourcesDirectory)/Server/.venv/bin/gunicorn main:socket_app \
            -w 4 -k uvicorn.workers.UvicornWorker \
            -b 0.0.0.0:8000 --log-level warning &
          CONNECTION_STRING=postgresql://postgres:postgres@localhost:5432/postgres \
            REDIS_URL=redis://localhost:6379/0 \
            $(Build.SourcesDirectory)/Server/.venv/bin/uvicorn main:socket_app \
            --host 0.0.0.0 --port 8001 --log-level warning &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break || sleep 2
          done
          for i in $(seq 1 30); do
            curl -sf http://localhost:8001/health && break || sleep 2
          done
        displayName: "Start Backend"
        workingDirectory: $(Build.SourcesDirectory)/Server

      - script: |
          npm ci
        displayName: "Install Frontend Dependencies"
        workingDirectory: $(Build.SourcesDirectory)/Webapp

      - script: |
          NEXT_PUBLIC_API_URL_DEV=http://localhost:8000/ \
            NEXT_PUBLIC_SHOW_LOCK_RUN=true \
            NEXT_PUBLIC_ENV=e2e \
            NEXT_PUBLIC_SERVER_PORT=8000 \
            npm run build
        displayName: "Build Frontend for E2E"
        workingDirectory: $(Build.SourcesDirectory)/Webapp

      - script: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          node .next/standalone/server.js &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000 > /dev/null && break || sleep 3
          done
        displayName: "Start Frontend"
        workingDirectory: $(Build.SourcesDirectory)/Webapp

      - script: |
          npm ci
          npx playwright install --with-deps chromium
        displayName: "Install Playwright"
        workingDirectory: $(Build.SourcesDirectory)/e2e

      - script: |
          FRONTEND_URL=http://localhost:3000 BACKEND_URL=http://localhost:8000 SECOND_BACKEND_URL=http://localhost:8001 npx playwright test
        displayName: "Run E2E Tests"
        workingDirectory: $(Build.SourcesDirectory)/e2e

      - task: PublishTestResults@2
        inputs:
          testResultsFormat: "JUnit"
          testResultsFiles: "$(Build.SourcesDirectory)/e2e/playwright-results.xml"
          failTaskOnFailedTests: true
        displayName: "Publish E2E Test Results"
        condition: succeededOrFailed()

      - script: |
          docker rm -f postgres-e2e redis-e2e || true
        displayName: "Stop Services"
        condition: always()
