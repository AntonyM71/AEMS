services:
  server:
    build: ./Server

    environment:
      - CONNECTION_STRING=postgresql://postgres:postgres@db:5432/postgres
      - REDIS_URL=redis://redis:6379/0
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/livez || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    ports:
      - "0.0.0.0:8000:8000"
    restart: always
    labels:
      - autoheal=true
    volumes:
      - ~/logs:/logs
    command:
      [
        "bash",
        "-c",
        "alembic upgrade head && python -m scripts.seed_scoresheets && gunicorn -w 4 -k uvicorn.workers.UvicornWorker --timeout 3600 main:socket_app -b 0.0.0.0:8000",
      ]

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./Webapp
    ports:
      - "0.0.0.0:3000:3000"
    depends_on:
      - server
    restart: always
    labels:
      - autoheal=true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:latest
    ports:
      - "81:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - server
    restart: always
    labels:
      - autoheal=true
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/nginx-health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - default
      - aems_shared
  db:
    image: postgres:17
    restart: always
    labels:
      - autoheal=true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - ~/postgres-prod-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    expose:
      - 5432

  redis:
    image: redis:7-alpine
    restart: always
    labels:
      - autoheal=true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - 6379

  # Docker Engine restarts a container only when its process exits; this
  # restarts the ones labelled autoheal=true whose healthcheck fails. Each
  # labelled service's healthcheck must test only that container, or autoheal
  # restarts a healthy service for another's fault.
  autoheal:
    image: willfarrell/autoheal:1.2.0
    restart: always
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  postgres-prod-data:

networks:
  aems_shared:
    external: true
